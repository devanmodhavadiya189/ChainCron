spring:
  application:
    name: chaincron

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: chaincron-workers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 1

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

chaincron:
  ethereum:
    rpc-url: ${ETH_RPC_URL}
    platform-wallet-address: ${PLATFORM_WALLET_ADDRESS}
    platform-wallet-private-key: ${PLATFORM_WALLET_PRIVATE_KEY}
    chain-id: 11155111

  platform:
    fee-wei: ${PLATFORM_FEE_WEI:1000000000000000}

  frontend:
    redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}

  alchemy:
    webhook-auth-token: ${ALCHEMY_WEBHOOK_AUTH_TOKEN}

  scheduler:
    poll-interval-seconds: 15
    executor-pool-size: ${EXECUTOR_POOL_SIZE:8}
    confirmation-check-delay-seconds: 20
    stale-job-timeout-seconds: 120
    stale-job-sweep-interval-seconds: 90

  kafka:
    topic:
      job-executions: job-executions

logging:
  level:
    com.chaincron: INFO
    org.web3j: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
